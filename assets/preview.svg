<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SSHuttleDeck Omarchy plugin preview</title>
  <desc id="desc">A dark Omarchy panel with a live SSHuttle tunnel, binary traffic flow, and a green SSH status indicator.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08140e"/>
      <stop offset="1" stop-color="#10151a"/>
    </linearGradient>
    <linearGradient id="live" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14532d"/>
      <stop offset="1" stop-color="#0b2b19"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#canvas)"/>
  <circle cx="1420" cy="130" r="260" fill="#166534" opacity=".16"/>
  <circle cx="170" cy="820" r="320" fill="#22c55e" opacity=".08"/>
  <g transform="translate(112 150)">
    <rect width="470" height="590" rx="34" fill="#111a17" stroke="#2e4539" stroke-width="2" filter="url(#shadow)"/>
    <g transform="translate(42 44)">
      <rect width="84" height="40" rx="20" fill="#16a34a" stroke="#86efac"/>
      <circle cx="20" cy="20" r="6" fill="#dcfce7"/>
      <text x="38" y="26" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">SSH</text>
      <text x="0" y="106" fill="#f0fdf4" font-family="sans-serif" font-size="43" font-weight="700">SSHuttleDeck</text>
      <text x="0" y="142" fill="#9db8aa" font-family="sans-serif" font-size="20">An SSHuttle VPN tunnel cockpit</text>
      <rect y="182" width="386" height="122" rx="18" fill="url(#live)" stroke="#4ade80"/>
      <text x="26" y="222" fill="#dcfce7" font-family="sans-serif" font-size="17" font-weight="700">TUNNEL LIVE</text>
      <text x="26" y="252" fill="#bbf7d0" font-family="sans-serif" font-size="18">Routing configured traffic through jle</text>
      <text x="26" y="287" fill="#86efac" font-family="monospace" font-size="13" opacity=".48">010011 100101 011010 110101 001011</text>
      <text x="0" y="358" fill="#d4e5dc" font-family="sans-serif" font-size="17" font-weight="700">SESSION 2h 18m</text>
      <text x="0" y="390" fill="#92aa9e" font-family="sans-serif" font-size="17">down 824 MiB  |  up 96 MiB</text>
      <text x="0" y="454" fill="#d4e5dc" font-family="sans-serif" font-size="17" font-weight="700">PUBLIC IP</text>
      <text x="0" y="486" fill="#92aa9e" font-family="sans-serif" font-size="17">200.75.10.73  |  Gtd Internet S.A.</text>
    </g>
  </g>
  <g transform="translate(700 205)">
    <text x="0" y="0" fill="#86efac" font-family="monospace" font-size="20" letter-spacing="3">OMARCHY NETWORK TOOL</text>
    <text x="0" y="72" fill="#f0fdf4" font-family="sans-serif" font-size="72" font-weight="700">Route through SSH.</text>
    <text x="0" y="142" fill="#f0fdf4" font-family="sans-serif" font-size="72" font-weight="700">See the flow.</text>
    <text x="0" y="205" fill="#a8bdb0" font-family="sans-serif" font-size="26">SSH config aliases, Tailscale machines, and custom endpoints.</text>
    <g transform="translate(0 292)">
      <circle cx="58" cy="58" r="58" fill="#0b2116" stroke="#4ade80" stroke-width="7"/>
      <circle cx="58" cy="58" r="38" fill="none" stroke="#bbf7d0" stroke-width="3" opacity=".7"/>
      <path d="M38 43l16 15-16 15M64 75h20" fill="none" stroke="#dcfce7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M140 58h290" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
      <circle cx="168" cy="58" r="7" fill="#dcfce7"/>
      <circle cx="238" cy="58" r="7" fill="#bbf7d0"/>
      <circle cx="308" cy="58" r="7" fill="#86efac"/>
      <circle cx="378" cy="58" r="7" fill="#4ade80"/>
      <text x="0" y="166" fill="#a8bdb0" font-family="sans-serif" font-size="24">Secure helper. Live state. A little bit of eye candy.</text>
    </g>
  </g>
  <text x="112" y="838" fill="#719082" font-family="sans-serif" font-size="18">SSHUTTLEDECK  /  SSH  /  VPN  /  TUNNEL</text>
</svg>

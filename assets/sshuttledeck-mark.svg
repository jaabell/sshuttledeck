<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SSHuttleDeck</title>
  <desc id="desc">A green terminal prompt inside an encrypted tunnel portal.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#112c20"/>
      <stop offset="1" stop-color="#06110c"/>
    </linearGradient>
    <linearGradient id="portal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="0.5" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#background)"/>
  <path d="M82 256h72M358 256h72" stroke="#4ade80" stroke-width="10" stroke-linecap="round" opacity=".5"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="#4ade80" stroke-width="2" opacity=".18"/>
  <circle cx="256" cy="256" r="144" fill="none" stroke="#4ade80" stroke-width="4" opacity=".35"/>
  <circle cx="256" cy="256" r="108" fill="#0b2116" stroke="url(#portal)" stroke-width="14" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="76" fill="none" stroke="#dcfce7" stroke-width="3" opacity=".55"/>
  <path d="M210 224l34 32-34 32" fill="none" stroke="#dcfce7" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M260 291h48" stroke="#bbf7d0" stroke-width="16" stroke-linecap="round"/>
  <circle cx="116" cy="256" r="10" fill="#86efac"/>
  <circle cx="396" cy="256" r="10" fill="#86efac"/>
  <circle cx="256" cy="82" r="7" fill="#4ade80" opacity=".75"/>
  <circle cx="256" cy="430" r="7" fill="#4ade80" opacity=".75"/>
</svg>
